services:
  - type: web
    name: whineup-evento
    env: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: true

      # sync: false  =>  el valor se introduce a mano en el panel de Render
      #                  y nunca queda escrito en el repositorio.
      - key: PUBLIC_URL
        sync: false
      - key: TICKET_SIGNING_SECRET
        sync: false
      - key: STAFF_USERS
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: EMAILJS_TEMPLATE_COMPRA
        sync: false
      - key: EMAILJS_TEMPLATE_TICKET
        sync: false

      - key: PAYMENT_PHONE
        sync: false
